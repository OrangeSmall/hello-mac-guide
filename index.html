let skillLevel=0,skillGroup='全部',skillStatus='全部';
const skillById=id=>SKILLS.find(s=>s.id===id);
function cleanSkills(values){const out={};for(const s of SKILLS){const n=values?.[s.id];if(Number.isInteger(n)&&n>=0&&n<=2)out[s.id]=n;}return out;}
function gestureArt(s){if(!s.gesture)return `<span class="skill-symbol" aria-hidden="true">${icon(s.group==='電源'?'lock':s.group==='視窗'?'layers':'keyboard')}</span>`;return `<div class="gesture-art" role="img" aria-label="示意：${esc(s.action)}"><div class="finger-dots">${'<i></i>'.repeat(s.gesture)}</div><strong>${esc(s.motion)}</strong><small>${s.id==='desktop'?'拇指＋另外三指':s.gesture===4?'依設定使用三／四指':s.gesture+' 指'}</small></div>`;}
function practiceBlock(id){const p=DAILY_PRACTICE[id-1];return `<section class="daily-practice"><span class="tag">今天的效率練習 · 約 3–5 分鐘</span><h3>${p.title}</h3><p>${p.task}</p><div class="practice-links">${p.ids.map(key=>{const s=skillById(key);return `<button class="button" data-action="skill" data-skill="${key}" data-day="${id}">${s.title}<span class="mastery-dot" aria-label="${MASTERY[state.skills?.[key]||0]}">${['○','◐','●'][state.skills?.[key]||0]}</span></button>`;}).join('')}</div><p class="small muted">先讀提示，再到 Mac 實作；忙碌時可另找時間練習。熟練度是自我評估，不會自動偵測你的操作。</p></section>`;}
function renderEfficiency(){main.innerHTML=pageHeading('每天一點，操作更順手。','從 Windows 習慣出發，依入門、熟悉、進階挑選操作；每一課也有對應的短練習。')+`<div class="eff-roadmap"><div><span>第 1 週</span><strong>先用得順</strong><small>基本手勢・電源</small></div><div><span>第 2 週</span><strong>少找按鈕</strong><small>拖移・切換・記錄</small></div><div><span>第 3 週</span><strong>多工工作</strong><small>並排・多桌面</small></div><div><span>第 4 週</span><strong>形成習慣</strong><small>整合・複習・備份</small></div></div><div class="toolbar"><div class="searchbox">${icon('search')}<input id="shortcut-search" type="search" value="${esc(shortcutQuery)}" placeholder="搜尋：三指、關機、並排、Windows…" aria-label="搜尋 Windows 與 Mac 操作"></div></div><div class="toolbar" aria-label="操作難度">${[-1,0,1,2,3].map(n=>`<button class="chip ${skillLevel===n?'active':''}" aria-pressed="${skillLevel===n}" data-action="skill-level" data-level="${n}">${n===-1?'全部':LEVELS[n]}</button>`).join('')}</div><div class="skill-controls"><label>操作類別<select id="skill-group">${['全部','觸控板','編輯','檔案','視窗','系統','瀏覽器','電源','疑難排解'].map(x=>`<option ${skillGroup===x?'selected':''}>${x}</option>`).join('')}</select></label><label>熟練度<select id="skill-status">${['全部',...MASTERY].map(x=>`<option ${skillStatus===x?'selected':''}>${x}</option>`).join('')}</select></label><p id="skill-summary" class="small muted" aria-live="polite"></p></div><div id="skill-results" class="skill-grid"></div><p id="skill-count" class="small muted" aria-live="polite"></p><div class="info-line">${icon('info')}手勢指數與快速鍵可能受系統、App 與設定影響。先看卡片的適用條件；本站只提供示範與自評，不會操控 Mac。三指拖移需另外啟用。</div><details class="legacy-shortcuts card panel"><summary>Windows → Mac 基本對照表（原有 17 項）</summary><div class="toolbar" id="shortcut-filters">${['全部','編輯','檔案','視窗','系統'].map(v=>`<button class="chip ${v===shortcutFilter?'active':''}" aria-pressed="${v===shortcutFilter}" data-action="shortcut-filter" data-value="${v}">${v}</button>`).join('')}</div><div class="shortcut-head"><span>我想做的事</span><span>Windows 習慣</span><span>Mac 的做法</span><span>複製</span></div><div id="shortcut-results"></div><p id="shortcut-count" class="small muted" aria-live="polite"></p></details><section class="card study-card"><div><h3>先把五個基本觀念記熟。</h3><p>完成小測驗，再回到今天的練習。</p></div><button class="button primary" data-action="quiz">開始小測驗</button><a class="button" href="#plan">回到 28 天計畫</a></section>`;updateSkillResults();updateShortcuts();}
function filteredSkills(){const q=shortcutQuery.trim().toLowerCase();return SKILLS.filter(s=>(skillLevel===-1||s.level===skillLevel)&&(skillGroup==='全部'||s.group===skillGroup)&&(skillStatus==='全部'||MASTERY[state.skills?.[s.id]||0]===skillStatus)&&[s.title,s.action,s.when,s.setup,s.tip,s.win||'',s.gesture?'觸控板 '+s.gesture+'指':''].join(' ').toLowerCase().includes(q));}
function updateSkillResults(){const list=filteredSkills();document.getElementById('skill-results').innerHTML=list.map(s=>`<article class="card skill-card"><div class="skill-top">${gestureArt(s)}<div><span class="tag">${LEVELS[s.level]} · ${s.group}</span><h2>${s.title}</h2></div></div><p class="skill-action">${esc(s.action)}</p><p>${s.when}</p><div class="skill-card-foot"><span class="small muted">${MASTERY[state.skills?.[s.id]||0]}</span><button class="button" data-action="skill" data-skill="${s.id}">看步驟與練習<span class="sr-only">：${s.title}</span></button></div></article>`).join('')||'<div class="card empty">目前篩選下沒有符合的操作。可切到「全部」難度或清除搜尋。<button class="button" data-action="clear-skills">清除篩選</button></div>';document.getElementById('skill-count').textContent=`顯示 ${list.length} / ${SKILLS.length} 項操作`;document.getElementById('skill-summary').textContent=`${SKILLS.filter(s=>state.skills?.[s.id]===2).length} / ${SKILLS.length} 項能獨立完成 · 與課程進度分開記錄`;}
function openSkill(key,day=0){const s=skillById(key);if(!s)return;const schedule=DAILY_PRACTICE.filter(p=>p.ids.includes(key)).map(p=>p.day);showModal(modalHead(s.title,`${LEVELS[s.level]} · ${s.group}`)+`<div class="modal-body">${gestureArt(s)}<p class="skill-action">${esc(s.action)}</p><p>${s.when}</p><h3>先確認設定</h3><p>${s.setup}</p><h3>${s.level===3?'閱讀情境，不必實作':'試著做一次'}</h3><p>${s.practice}</p><div class="outcome"><strong>操作提醒</strong>${s.tip}</div><p class="small muted">${schedule.length?'安排在第 '+schedule.join('、')+' 天；可隨時提早查看或複習。':'需要時查閱，不列入每日必做練習。'}</p>${external(EFF_SOURCES[s.source],'Apple 官方操作說明')}<fieldset class="mastery-field"><legend>我的熟練度（自我評估）</legend><div class="mastery-buttons">${MASTERY.map((label,n)=>`<button class="chip ${(state.skills?.[key]||0)===n?'active':''}" aria-pressed="${(state.skills?.[key]||0)===n}" data-action="mastery" data-skill="${key}" data-value="${n}" data-day="${day}">${label}</button>`).join('')}</div><p class="small muted">只保存在此瀏覽器；可隨進度匯出。這不是裝置偵測結果。</p></fieldset><div class="button-row">${day?`<button class="button primary" data-action="lesson" data-id="${day}">返回第 ${day} 天課程</button>`:''}<button class="button" data-action="close">關閉</button></div></div>`);}
function setMastery(key,value){if(!skillById(key)||!Number.isInteger(value)||value<0||value>2)return;state.skills=state.skills||{};state.skills[key]=value;save();}
function handleEfficiencyAction(b){const a=b.dataset.action;if(a==='skill'){openSkill(b.dataset.skill,Number(b.dataset.day)||0);return true;}if(a==='mastery'){setMastery(b.dataset.skill,Number(b.dataset.value));if(currentPage==='shortcuts')updateSkillResults();openSkill(b.dataset.skill,Number(b.dataset.day)||0);return true;}if(a==='skill-level'){skillLevel=Number(b.dataset.level);renderEfficiency();return true;}if(a==='clear-skills'){skillLevel=-1;skillGroup='全部';skillStatus='全部';shortcutQuery='';renderEfficiency();return true;}return false;}

const DEFAULT={version:1,done:[],notes:{},checks:{},skills:{},profile:'general',minutes:'30',startDate:''};
let storageAvailable=true;
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number),v=new Date(y,m-1,d,12);return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d;}
function cleanState(d){if(!d||typeof d!=='object'||d.version!==1)throw Error('不支援的進度檔案格式');const notes={};for(const [k,v]of Object.entries(d.notes||{})){if(/^([1-9]|1[0-9]|2[0-8])$/.test(k)&&typeof v==='string')notes[k]=v.slice(0,3000);}const checks={};for(const f of CONNECTIONS)if(Array.isArray(d.checks?.[f.id]))checks[f.id]=[...new Set(d.checks[f.id].filter(v=>Number.isInteger(v)&&v>=0&&v<f.needs.length))];return {version:1,done:[...new Set((Array.isArray(d.done)?d.done:[]).filter(n=>Number.isInteger(n)&&n>=1&&n<=28))],notes,checks,skills:cleanSkills(d.skills),profile:['general','marketing','study'].includes(d.profile)?d.profile:'general',minutes:['15','30','45'].includes(d.minutes)?d.minutes:'30',startDate:validDate(d.startDate)?d.startDate:''};}
let state;try{state=cleanState(JSON.parse(localStorage.getItem(STORAGE)||JSON.stringify(DEFAULT)));}catch{state=structuredClone(DEFAULT);try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{storageAvailable=false;}}
let currentPage='home',week=0,shortcutFilter='全部',shortcutQuery='',onlyPending=false,feature='airdrop',promptType='copywriting',promptContext='',quizIndex=0,quizScore=0,quizAnswered=false;

function renderHome(){const l=nextLesson(),all=state.done.length===28;main.innerHTML=pageHeading(state.done.length?'歡迎回來，繼續熟悉 Mac。':'嗨，準備和 Mac 熟悉一下？',dailyTime(),`<span class="date-label">${icon('calendar')}${new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}</span>`)+`<section class="hero"><div class="hero-copy"><div class="eyebrow">A FRESH START, AT YOUR OWN PACE</div><h1>新系統，<br>慢慢就會很順手。</h1><p>從熟悉的 Windows 出發，<br>用 28 天，建立你的 Mac、iPhone 與 AI 工作日常。</p><div class="button-row"><button class="button primary" data-action="lesson" data-id="${l.id}">${icon('play')}${all?'再複習一個練習':state.done.length?'繼續我的學習':'開始第一天'}</button><button class="button subtle" data-action="settings">設定我的步調</button></div></div><div class="hero-art" role="img" aria-label="Mac 筆電與 iPhone 的簡約插畫"><div class="orbit"></div><div class="laptop-art"><div class="laptop-screen"><div class="screen-hello">hello.</div><div class="screen-dock"><i></i><i></i><i></i><i></i><i></i></div></div><div class="laptop-base"></div></div><div class="phone-art">✳</div><div class="floating-key">⌘</div><div class="art-label">${icon('check')}一起開始新的工作日常</div></div></section>${all?'<div class="complete-banner"><h2>28 天練習，全部完成。</h2><p>你已經建立自己的 Mac 使用方法。接下來，挑一個最有幫助的技能繼續練習。</p></div>':''}<div class="dashboard-grid"><div><div class="section-top"><h2>${all?'再回顧一次':'下一個小練習'}</h2><a href="#plan">查看完整計畫</a></div><section class="card continue-card"><span class="lesson-icon">${icon(WEEKS[l.week].icon)}</span><div class="continue-info"><span class="tag">DAY ${String(l.id).padStart(2,'0')} · ${WEEKS[l.week].short}</span><h3>${l.title}</h3><p>${icon('clock').replace('class="icon"','class="icon" style="width:12px;height:12px;vertical-align:-2px"')} ${state.minutes} 分鐘起 · ${profileName()}</p></div><button class="button primary" data-action="lesson" data-id="${l.id}">開始練習</button></section><div class="section-top"><h2>你的四週學習路線</h2><span class="small muted">一步一步，建立新習慣</span></div><div class="course-grid">${WEEKS.map(courseCard).join('')}</div></div><aside class="dashboard-aside"><section class="card progress-card"><h2>我的學習進度</h2><div class="progress-ring" style="--pct:${pct()}" role="img" aria-label="已完成 ${pct()}%"><div class="ring-inner"><strong>${pct()}<span>%</span></strong><small>已完成</small></div></div><p>${state.done.length===0?'不急，從第一個練習開始。':state.done.length===28?'把新習慣帶進每一天。':'每一個完成，都算數。'}</p><div class="stats"><div><strong>${state.done.length}<span class="small muted"> / 28</span></strong><small>完成練習</small></div><div><strong>${WEEKS.filter((_,i)=>count(i)===7).length}<span class="small muted"> / 4</span></strong><small>完成階段</small></div></div></section><section class="tip-card"><h3>${icon('light')}換個按鍵，就很熟悉</h3><div class="key-compare"><div><small>WINDOWS</small><kbd class="key">Ctrl</kbd></div><span class="muted">→</span><div><small>MAC</small><kbd class="key">⌘</kbd></div></div><p>複製、貼上、儲存，<br>常用操作從 Command 開始。</p><a href="#shortcuts">看看操作對照表</a></section></aside></div><section class="quick-links"><a class="quick-link" href="#shortcuts">${icon('keyboard')}<div>找一個快捷鍵<span>用 Windows 習慣來查詢</span></div></a><a class="quick-link" href="#iphone">${icon('phone')}<div>連動我的 iPhone<span>先檢查，再一步步設定</span></div></a><a class="quick-link" href="#ai">${icon('spark')}<div>試一個 AI 任務<span>文案、整理與計算練習</span></div></a></section>`;}
function renderPlan(){main.innerHTML=pageHeading('每天一點，四週上手。','28 個練習都能隨時回看；完成後勾選，依你的步調往前。',`<button class="button" data-action="settings">${icon('calendar')}設定開始日</button>`)+`<div class="toolbar"><div class="tabs" role="tablist" aria-label="學習週次">${WEEKS.map((w,i)=>`<button role="tab" aria-selected="${week===i}" data-action="select-week" data-id="${i}">第 ${i+1} 週</button>`).join('')}</div><label class="plan-filter"><input type="checkbox" id="pending-only" ${onlyPending?'checked':''}>只看未完成</label></div><section class="card plan-overview"><span class="course-icon ${WEEKS[week].color}">${icon(WEEKS[week].icon)}</span><div><h2>${WEEKS[week].title}</h2><p>${WEEKS[week].desc}</p></div><span class="week-count">${count(week)} / 7 完成</span></section><div class="lesson-list">${LESSONS.filter(l=>l.week===week&&(!onlyPending||!state.done.includes(l.id))).map(l=>`<article class="lesson-row ${state.done.includes(l.id)?'completed':''}"><div class="lesson-day">DAY<strong>${String(l.id).padStart(2,'0')}</strong></div><div class="lesson-row-content"><h3>${l.title}</h3><p>${l.intro}</p><p class="daily-label">＋效率練習：${DAILY_PRACTICE[l.id-1].title}</p></div><div class="row-meta"><span class="small muted">${lessonDate(l.id)||`${state.minutes} 分鐘起`}</span><button class="button" data-action="lesson" data-id="${l.id}">${state.done.includes(l.id)?'回顧內容':'查看練習'}</button><button class="done-button" data-action="toggle-day" data-id="${l.id}" aria-label="${state.done.includes(l.id)?'取消完成':'標記完成'}第 ${l.id} 天" aria-pressed="${state.done.includes(l.id)}">${state.done.includes(l.id)?icon('check'):''}</button></div></article>`).join('')||'<div class="card empty">這一週已全部完成。取消「只看未完成」就能回顧所有練習。</div>'}</div><div class="info-line">${icon('info')}開始日期用來顯示參考排程，不會發送提醒。忙碌時可以順延，已完成的內容不受影響。</div>`;}
function renderLegacyShortcuts(){main.innerHTML=pageHeading('熟悉的操作，換一種按法。','先用你習慣的 Windows 操作查詢，再慢慢記住 Mac 的按鍵。')+`<div class="toolbar"><div class="searchbox">${icon('search')}<input id="shortcut-search" type="search" placeholder="搜尋操作，例如：截圖、複製、找檔案" value="${esc(shortcutQuery)}" aria-label="搜尋 Windows 與 Mac 操作"></div></div><div class="toolbar" id="shortcut-filters">${['全部','編輯','檔案','視窗','系統'].map(v=>`<button class="chip ${v===shortcutFilter?'active':''}" aria-pressed="${v===shortcutFilter}" data-action="shortcut-filter" data-value="${v}">${v}</button>`).join('')}</div><div class="card"><div class="shortcut-head"><span>我想做的事</span><span>Windows 習慣</span><span>Mac 的做法</span><span>複製</span></div><div id="shortcut-results"></div></div><p id="shortcut-count" class="small muted" aria-live="polite" style="margin-top:15px"></p><section class="card study-card"><span class="course-icon teal">${icon('keyboard')}</span><div><h3>記住了嗎？做個小練習。</h3><p>5 題常用操作，看看哪些已經變成直覺。</p></div><button class="button primary" data-action="quiz">開始小測驗</button></section><div class="info-line">${icon('info')}⌘ Command · ⌥ Option · ⌃ Control · ⇧ Shift。各 App 的快速鍵可能不同，仍以 App 選單顯示為準。</div>${external(SOURCES.keys,'Apple 官方快捷鍵說明')}`;updateShortcuts();}
function updateShortcuts(){const found=SHORTCUTS.map((s,i)=>({s,i})).filter(({s})=>(shortcutFilter==='全部'||s[4]===shortcutFilter)&&s.join(' ').toLowerCase().includes(shortcutQuery.toLowerCase().trim()));document.getElementById('shortcut-results').innerHTML=found.map(({s,i})=>`<div class="shortcut-row"><div><strong>${s[0]}</strong><span class="key-note">${s[4]}</span></div><div class="win-key">${s[1]}</div><div class="mac-cell"><span class="mac-key">${s[2]}</span><span class="key-note">${s[5]}</span></div><button class="icon-button" data-action="copy-shortcut" data-id="${i}" aria-label="複製${s[0]}快捷鍵">${icon('copy')}</button></div>`).join('')||'<div class="empty">找不到這個操作，試試「截圖」「儲存」或「移動檔案」。</div>';document.getElementById('shortcut-count').textContent=`共 ${found.length} 個操作`;}
function renderIphone(){const f=CONNECTIONS.find(x=>x.id===feature),n=(state.checks[f.id]||[]).length;main.innerHTML=pageHeading('讓兩台裝置，成為好搭檔。','先選你想做的事，再核對條件。沒有 iPhone，也可以繼續學習其他課程。')+`<div class="feature-selector">${CONNECTIONS.map(x=>`<button class="feature-select ${x.id===feature?'active':''}" data-action="feature" data-value="${x.id}" aria-pressed="${x.id===feature}">${icon(x.icon)}<strong>${x.name}</strong><small>${x.sub}</small></button>`).join('')}</div><div class="two-cols"><section class="card panel"><div class="section-top"><h2>開始前，確認一下</h2><span id="check-count" class="small muted">${n} / ${f.needs.length}</span></div>${f.needs.map((s,i)=>`<label class="check-line"><input type="checkbox" data-check="${i}" ${state.checks[f.id]?.includes(i)?'checked':''}><span>${s}</span></label>`).join('')}<div id="connection-status" class="status-result ${n===f.needs.length?'ready':''}">${connectionStatus(f,n)}</div></section><section class="card panel"><h2>${f.name}怎麼開始</h2><ol class="steps">${f.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="muted">${f.tip}</p>${external(SOURCES[f.source],'查看 Apple 官方設定與需求')}</section></div><div class="privacy-note"><strong>同步不是完整備份。</strong><br>iCloud 讓你在不同裝置使用同一份內容，刪除也可能同步。重要工作另外使用 Time Machine 或適合的備份方式，並練習還原。</div>`;}
function connectionStatus(f,n){return n===f.needs.length?'已完成自我檢查，可以開始右側步驟。這不是裝置偵測結果，實際連線仍以裝置與官方需求為準。':`還有 ${f.needs.length-n} 項待確認。先檢查設定，再開始操作；沒有把握的項目先不要勾選。`;}
function getPrompt(){const context=promptContext.trim()||'［在此貼上已確認的資料］';if(promptType==='copywriting')return `你是我的${state.profile==='marketing'?'行銷文案':'寫作'}助理。請根據以下已確認資料，用繁體中文寫一版 150 字內的簡短版，以及一版 250 字內的完整說明。語氣自然清楚。名稱、規格、數字與日期不得自行更改；缺少的資料請標示「待確認」，不要自行補充優惠或事實。最後列出我需要核對的項目。\n\n資料：\n${context}`;if(promptType==='organize')return `請將以下紀錄整理成主題、內容、待辦、負責人、期限等欄位。只整理已提供的資訊，不推測缺值。重複或矛盾的內容另外列出，無法確定的部分標示「待確認」。最後提供一份可逐項核對的清單。\n\n原始資料：\n${context}`;return `請分析附件或以下資料。先列出資料筆數、欄位、缺值、重複列，並確認分組、單位、折扣、退貨與稅額的處理方式。使用公式或執行程式進行計算，提供各組小計與總計，以及 3 筆可以人工驗算的原始紀錄。說明計算方法與假設，不推算未提供的成本或毛利。\n\n資料與需求：\n${context}`;}
function renderAi(){main.innerHTML=pageHeading('讓 AI，幫上實際的忙。','從一個小任務開始：整理資料、寫好文案，再把數字核對清楚。')+`<div class="ai-intro">${icon('spark')}<div><strong>這裡是練習室，不是 AI 對話服務。</strong><br>選擇任務產生提示詞，再複製到你使用的 AI 工具。此頁不呼叫模型，也不會上傳你填寫的資料。</div></div><div class="two-cols"><section class="card panel"><h2>準備你的任務</h2><label class="field">想完成什麼？<select id="prompt-type"><option value="copywriting" ${promptType==='copywriting'?'selected':''}>文案與說明</option><option value="organize" ${promptType==='organize'?'selected':''}>整理筆記與待辦</option><option value="analysis" ${promptType==='analysis'?'selected':''}>表格與數據分析</option></select></label><label class="field">已確認資料或工作情境<textarea id="prompt-context" maxlength="8000" placeholder="例如：週末閱讀分享會，週六下午 2 點，參加費 200 元，名額 20 人。請做成簡短邀請。">${esc(promptContext)}</textarea></label><p class="small muted">先用模擬資料練習。正式工作資料請依公司規定處理，避免貼入個資與密碼。此欄不保存在進度檔。</p></section><section class="card panel"><div class="section-top"><h2>你的提示詞</h2><span class="tag">可直接複製</span></div><div id="prompt-output" class="prompt-output">${esc(getPrompt())}</div><div class="button-row prompt-actions"><button class="button primary" data-action="copy-prompt">${icon('copy')}複製提示詞</button><a class="button" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">開啟 ChatGPT ${icon('external')}</a></div></section></div><section class="card calc-card"><div class="section-top"><h2>算完了，也要能驗算。</h2><span class="tag">模擬資料</span></div><p class="small muted">調整單價與數量，先算出你的答案，再核對小計與總計。金額以元計，數量為非負整數。</p><div class="calc-grid calc-head"><span>品項</span><span>單價（元）</span><span>數量</span><span>小計</span></div>${['A','B'].map((v,i)=>`<div class="calc-grid calc-row"><strong class="calc-name">練習品項 ${v}</strong><label><span class="small muted">單價</span><input class="calc-input" type="number" id="price-${i}" min="0" max="1000000" step="0.01" value="${i?499:399}" aria-label="品項 ${v} 單價"></label><label><span class="small muted">數量</span><input class="calc-input" type="number" id="qty-${i}" min="0" max="100000" step="1" value="${i?8:12}" aria-label="品項 ${v} 數量"></label><span class="calc-result" id="subtotal-${i}">核對後顯示</span></div>`).join('')}<div class="field" style="max-width:350px"><label for="guess-total">你算出的總金額（元）</label><input id="guess-total" type="number" min="0" step="0.01" placeholder="輸入你的答案"></div><div class="button-row"><button class="button primary" data-action="verify-calc">核對答案</button><button class="button" data-action="show-calc">顯示計算方法</button></div><div id="calc-feedback" class="calc-feedback" aria-live="polite">小計 = 單價 × 數量；總計 = 所有小計加總。試算表可使用 =B2*C2 與 SUM。</div></section><div class="info-line">${icon('info')}需要精確值時，提供欄位清楚的 XLSX 或 CSV；AI 可能無法準確讀取表格截圖。檢查假設、公式與原始資料，再使用分析結果。</div>${external(SOURCES.analysis,'OpenAI 資料分析說明')}`;}
function renderResources(){main.innerHTML=pageHeading('需要的工具，慢慢加就好。','先沿用熟悉的工具，把常用流程做順，再決定下一步。')+`<div class="resource-grid">${[
['檔案移轉','先複製 10 個近期檔案，檢查字體、公式與列印。大量資料可使用 Apple 系統移轉輔助程式。','transfer','查看移轉指南'],['備份與還原','同步之外再保留備份。設定 Time Machine 時先確認外接磁碟內容，並練習還原測試檔。','backup','查看備份指南'],['文書與創作','公司用 Office 就先沿用既有流程；簡單文件可試 Pages、Numbers。照片、設計與短片用熟悉的工具，先確認 Mac 版本及授權。','keys','查看基本操作'],['AI 工具','先用既有雲端 AI 帳號。本機模型等進階需求，確認晶片、記憶體與實際用途後再規劃。Apple Intelligence 需另確認資格。','intelligence','查看 Apple Intelligence 需求']
].map(([t,d,s,a])=>`<section class="card resource-item"><h3>${t}</h3><p>${d}</p>${external(SOURCES[s],a)}</section>`).join('')}</div><section class="faq"><h2>新手常遇到的問題</h2>${FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</section><section class="privacy-note"><strong>你的學習，保留在自己手上。</strong><br>課程進度、筆記及設定只保存在目前的瀏覽器，不會自動在 Mac 與 iPhone 之間同步。換裝置前可以先匯出進度檔，再在另一台匯入。<div class="button-row" style="margin-top:15px"><button class="button" data-action="export">${icon('download')}匯出我的進度</button><button class="button" data-action="import">${icon('upload')}匯入進度</button></div></section><section class="subsection"><h2>繼續閱讀官方說明</h2><p class="small muted">內容核對：2026 年 11 月 22 日。系統介面與功能資格可能調整，請以官方文件及裝置顯示為準。</p><div class="source-list">${[['keys','Mac 鍵盤快速鍵'],['continuity','接續互通功能與需求'],['clipboard','通用剪貼板'],['mirror','iPhone 鏡像輸出'],['scan','接續互通文件掃描'],['chatgpt','ChatGPT 官方下載']].map(([s,t])=>`<a href="${SOURCES[s]}" target="_blank" rel="noopener noreferrer">${t}</a>`).join('')}</div></section>`;}
function render(){document.getElementById('page-name').textContent=titles[currentPage];document.querySelectorAll('[data-nav]').forEach(e=>{e.classList.toggle('active',e.dataset.nav===currentPage);if(e.dataset.nav===currentPage)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current');});({home:renderHome,plan:renderPlan,shortcuts:renderEfficiency,iphone:renderIphone,ai:renderAi,resources:renderResources}[currentPage])();paintIcons();}
function navigate(){const next=location.hash.slice(1).split('?')[0]||'home';currentPage=titles[next]?next:'home';render();closeNav();window.scrollTo(0,0);}
let lastFocus;function showModal(html){lastFocus=document.activeElement;document.getElementById('modal-content').innerHTML=html;if(!modal.open)modal.showModal();modal.scrollTop=0;paintIcons(modal);}
function modalHead(title,tag=''){return `<div class="modal-head"><div>${tag?`<span class="tag">${tag}</span>`:''}<h2 id="modal-title">${title}</h2></div><button class="icon-button" data-action="close" aria-label="關閉視窗">${icon('close')}</button></div>`;}
function closeModal(){modal.close();lastFocus?.focus?.();}
function exerciseFor(l){const examples={general:'工作練習：選一份會議資料、專案紀錄或工作文件。',marketing:'行銷練習：選一組商品照片、到貨資料、活動文案或門市報表。',study:'學習練習：選一份讀書筆記、課堂資料、旅行計畫或生活預算。'};return l.id>=15?examples[state.profile]:'使用測試檔練習，先保留原始資料。';}
function openLesson(id){const l=LESSONS[id-1];if(!l)return;showModal(modalHead(l.title,`DAY ${String(id).padStart(2,'0')} · ${WEEKS[l.week].short}`)+`<div class="modal-body"><p>${l.intro}</p><p class="small">${exerciseFor(l)}</p><ol class="steps">${l.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="outcome"><strong>做到這樣，就完成了</strong>${l.check}</div><p class="modal-tip">${l.tip}</p>${external(SOURCES[l.source],'閱讀官方說明')}${practiceBlock(id)}<label class="field">我的練習筆記 <span class="note-status" id="note-status">只存於這個瀏覽器</span><textarea class="note-input" data-note="${id}" maxlength="3000" placeholder="記下卡住的地方，或今天學會的小技巧。">${esc(state.notes[id]||'')}</textarea></label><div class="modal-footer"><button class="button ${state.done.includes(id)?'':'primary'}" data-action="complete-lesson" data-id="${id}">${icon('check')}${state.done.includes(id)?'已完成 · 取消標記':'標記本日完成'}</button>${id<28?`<button class="button" data-action="lesson" data-id="${id+1}">下一個練習</button>`:'<button class="button" data-action="export">匯出學習紀錄</button>'}</div></div>`);}
function toggleDay(id){if(id<1||id>28)return;state.done=state.done.includes(id)?state.done.filter(n=>n!==id):[...state.done,id];save();render();}
function openSettings(){showModal(modalHead('設定你的學習步調','MY LEARNING')+`<div class="modal-body"><p>不需要一次學會全部。這些設定只影響你的練習提示與參考日期。</p><div class="settings-grid"><label class="field">主要用途<select id="profile-select"><option value="general" ${state.profile==='general'?'selected':''}>一般工作</option><option value="marketing" ${state.profile==='marketing'?'selected':''}>行銷企劃</option><option value="study" ${state.profile==='study'?'selected':''}>學習與生活</option></select></label><label class="field">每天想花多久<select id="minutes-select">${['15','30','45'].map(v=>`<option value="${v}" ${state.minutes===v?'selected':''}>${v} 分鐘</option>`).join('')}</select></label></div><label class="field">開始日期（選填）<input type="date" id="start-date" value="${state.startDate}"></label><p class="small muted">15 分鐘可把一課分兩次完成，28 天是課程順序，不是截止期限。參考排程不會自動發送通知。</p><button class="button primary" data-action="save-settings">儲存我的設定</button><div class="export-box"><h3>備份與換裝置</h3><p>進度不會自動跨裝置同步。匯出檔包含你的完成紀錄、筆記、操作熟練度與設定，請自行保管。</p><div class="button-row"><button class="button" data-action="export">${icon('download')}匯出進度</button><button class="button" data-action="import">${icon('upload')}匯入進度</button></div></div><details class="danger-section"><summary>重新開始學習</summary><p class="small muted">清除目前瀏覽器的進度、筆記與設定；建議先匯出備份。</p><button class="button danger" data-action="confirm-reset">清除學習紀錄</button></details></div>`);}
const QUIZ=[{q:'在 Mac 複製文字，用哪個快捷鍵？',choices:['Control + C','Command + C','Option + C'],answer:1,explain:'常用的複製使用 Command + C。'}, {q:'想結束整個 App，應該按哪個？',choices:['Command + Q','Command + W','空白鍵'],answer:0,explain:'Command + Q 結束 App；Command + W 通常只關視窗。'}, {q:'Finder 選好檔案後，按什麼快速預覽？',choices:['F2','Delete','空白鍵'],answer:2,explain:'空白鍵可快速預覽選取的檔案。'}, {q:'要擷取一個螢幕區域，使用哪個？',choices:['Shift + Command + 4','Command + 4','Control + 4'],answer:0,explain:'Shift + Command + 4，接著拖曳選取範圍。'}, {q:'手機與 Mac 同步了檔案，就等於完整備份嗎？',choices:['是，兩台都有就一定安全','不是，仍需獨立備份與還原測試'],answer:1,explain:'同步刪除可能影響兩端；重要資料要另行備份並測試還原。'}];
function openQuiz(reset=false){if(reset){quizIndex=0;quizScore=0;}quizAnswered=false;if(quizIndex>=QUIZ.length){showModal(modalHead('小測驗完成','5 個常用觀念')+`<div class="modal-body"><p class="quiz-question">答對 ${quizScore} / ${QUIZ.length} 題</p><p>${quizScore===5?'常用操作已經很熟悉了！把它們用到今天的工作裡。':'不用急著全記住。回到對照表，挑剛才不熟的操作再做一次。'}</p><div class="button-row"><button class="button primary" data-action="quiz">再練習一次</button><button class="button" data-action="close">回到對照表</button></div></div>`);return;}const q=QUIZ[quizIndex];showModal(modalHead('操作小測驗',`第 ${quizIndex+1} / ${QUIZ.length} 題`)+`<div class="modal-body"><p class="quiz-question">${q.q}</p><div class="quiz-choices">${q.choices.map((c,i)=>`<button data-action="quiz-answer" data-id="${i}">${c}</button>`).join('')}</div><div id="quiz-feedback" class="quiz-feedback" role="status"></div><button class="button primary" id="quiz-next" data-action="quiz-next" disabled>${quizIndex===4?'查看結果':'下一題'}</button></div>`);}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已複製，可以貼上使用。');}catch{showModal(modalHead('選取文字後複製')+`<div class="modal-body"><p>此瀏覽器無法直接使用剪貼板，請手動複製下方內容。</p><textarea class="prompt-output" readonly style="width:100%">${esc(text)}</textarea></div>`);}}
function exportProgress(){const payload=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),url=URL.createObjectURL(new Blob([payload],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='HelloMac_學習進度_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已開始下載進度備份。');}
function importProgress(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;if(file.size>250000){toast('檔案過大，請選擇 Hello Mac 匯出的進度 JSON。');return;}try{const incoming=cleanState(JSON.parse(await file.text()));showModal(modalHead('匯入這份學習進度？')+`<div class="modal-body"><p>這份紀錄已完成 ${incoming.done.length} / 28 課，包含 ${Object.keys(incoming.notes).length} 則筆記、${Object.values(incoming.skills).filter(v=>v===2).length} 項熟練操作。匯入會取代目前的紀錄。</p><div class="button-row"><button class="button" data-action="export">先備份目前進度</button><button class="button primary" id="confirm-import">確認匯入</button><button class="button" data-action="close">取消</button></div></div>`);document.getElementById('confirm-import').addEventListener('click',()=>{state=incoming;save();closeModal();render();toast('進度已匯入。');});}catch{toast('無法讀取此檔案，請選擇 Hello Mac 匯出的進度 JSON。');}});input.click();}
function calculate(showOnly=false){const vals=[0,1].map(i=>({p:document.getElementById(`price-${i}`).value,q:document.getElementById(`qty-${i}`).value}));const fb=document.getElementById('calc-feedback');if(vals.some(v=>!v.p.trim()||!v.q.trim()||!Number.isFinite(+v.p)||!Number.isFinite(+v.q)||+v.p<0||+v.p>1e6||+v.q<0||+v.q>1e5||!Number.isInteger(+v.q)||!/^(\d+)(\.\d{1,2})?$/.test(v.p))){fb.textContent='請填入有效單價（0–1,000,000，最多兩位小數）與整數數量（0–100,000）。';return;}const subs=vals.map(v=>Math.round(+v.p*100)*+v.q),total=subs.reduce((a,b)=>a+b,0),format=n=>(n/100).toLocaleString('zh-TW',{minimumFractionDigits:0,maximumFractionDigits:2});const guess=document.getElementById('guess-total').value;subs.forEach((v,i)=>document.getElementById('subtotal-'+i).textContent='$ '+format(v));if(!showOnly&&(!guess.trim()||!Number.isFinite(+guess)||+guess<0)){fb.textContent='請先輸入你算出的總金額，或選「顯示計算方法」。';return;}const correct=Math.abs(+guess-total/100)<0.005;fb.textContent=`${showOnly?'計算方法':correct?'答對了！每筆小計與總計一致。':'再核對一次，答案與計算結果不同。'} 品項 A：${vals[0].p} × ${vals[0].q} = ${format(subs[0])}；品項 B：${vals[1].p} × ${vals[1].q} = ${format(subs[1])}。總計：${format(total)} 元。`;}
function closeNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(handleEfficiencyAction(b))return;const id=Number(b.dataset.id),a=b.dataset.action;
 if(a==='settings')openSettings();else if(a==='close')closeModal();else if(a==='lesson')openLesson(id);else if(a==='week'){week=id;if(location.hash==='#plan'){currentPage='plan';render();window.scrollTo(0,0);}else location.hash='plan';}else if(a==='select-week'){week=id;renderPlan();}else if(a==='toggle-day'){toggleDay(id);toast(state.done.includes(id)?'已記下今天的進步。':'已取消完成標記。');}else if(a==='complete-lesson'){toggleDay(id);openLesson(id);toast(state.done.includes(id)?'完成一個練習，很好。':'已取消完成標記。');}else if(a==='shortcut-filter'){shortcutFilter=b.dataset.value;document.querySelectorAll('#shortcut-filters button').forEach(el=>{el.classList.toggle('active',el===b);el.setAttribute('aria-pressed',el===b);});updateShortcuts();}else if(a==='copy-shortcut')copy(SHORTCUTS[id][0]+'：'+SHORTCUTS[id][3]);else if(a==='feature'){feature=b.dataset.value;renderIphone();}else if(a==='copy-prompt')copy(getPrompt());else if(a==='verify-calc')calculate();else if(a==='show-calc')calculate(true);else if(a==='quiz')openQuiz(true);else if(a==='quiz-answer'&&!quizAnswered){quizAnswered=true;const q=QUIZ[quizIndex];if(id===q.answer)quizScore++;document.querySelectorAll('[data-action="quiz-answer"]').forEach(el=>{el.disabled=true;if(+el.dataset.id===q.answer)el.classList.add('correct');else if(el===b)el.classList.add('wrong');});document.getElementById('quiz-feedback').textContent=(id===q.answer?'答對了！':'再記住這一點：')+q.explain;document.getElementById('quiz-next').disabled=false;}else if(a==='quiz-next'){quizIndex++;openQuiz();}else if(a==='save-settings'){const date=document.getElementById('start-date').value;if(date&&!validDate(date)){toast('請填入有效日期。');return;}state.profile=document.getElementById('profile-select').value;state.minutes=document.getElementById('minutes-select').value;state.startDate=date;save();closeModal();render();toast('學習設定已儲存。');}else if(a==='export')exportProgress();else if(a==='import')importProgress();else if(a==='confirm-reset'){showModal(modalHead('確定重新開始？')+`<div class="modal-body"><p>將清除這個瀏覽器的完成紀錄、課程筆記與設定。此操作無法復原；若有匯出檔，可以再匯入。</p><div class="button-row"><button class="button" data-action="export">先匯出備份</button><button class="button danger" data-action="reset">確認清除</button><button class="button" data-action="settings">保留紀錄</button></div></div>`);}else if(a==='reset'){state=structuredClone(DEFAULT);save();closeModal();render();toast('已清除紀錄，可以重新開始。');}
});
document.addEventListener('input',e=>{if(e.target.id==='shortcut-search'){shortcutQuery=e.target.value;updateShortcuts();if(currentPage==='shortcuts')updateSkillResults();}if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save();document.getElementById('note-status').textContent=storageAvailable?'已儲存於此瀏覽器':'暫時無法儲存，請匯出進度';}if(e.target.id==='prompt-context'){promptContext=e.target.value;document.getElementById('prompt-output').textContent=getPrompt();}if(e.target.classList.contains('calc-input')){document.getElementById('calc-feedback').textContent='資料已變更，請重新核對答案。';[0,1].forEach(i=>document.getElementById('subtotal-'+i).textContent='核對後顯示');}});
document.addEventListener('change',e=>{if(e.target.id==='skill-group'){skillGroup=e.target.value;updateSkillResults();}if(e.target.id==='skill-status'){skillStatus=e.target.value;updateSkillResults();}if(e.target.id==='pending-only'){onlyPending=e.target.checked;renderPlan();}if(e.target.id==='prompt-type'){promptType=e.target.value;document.getElementById('prompt-output').textContent=getPrompt();}if(e.target.hasAttribute('data-check')){const n=+e.target.dataset.check,f=CONNECTIONS.find(x=>x.id===feature);state.checks[feature]=(state.checks[feature]||[]).filter(v=>v!==n);if(e.target.checked)state.checks[feature].push(n);save();const len=state.checks[feature].length;document.getElementById('check-count').textContent=`${len} / ${f.needs.length}`;const box=document.getElementById('connection-status');box.textContent=connectionStatus(f,len);box.classList.toggle('ready',len===f.needs.length);}});
document.getElementById('menu-toggle').addEventListener('click',()=>{const open=!document.getElementById('sidebar').classList.contains('open');document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));});document.getElementById('scrim').addEventListener('click',closeNav);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();});modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});window.addEventListener('hashchange',navigate);window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){try{state=cleanState(JSON.parse(e.newValue));if(!modal.open)render();}catch{}}});navigate();if(!storageAvailable)toast('瀏覽器儲存不可用，學習後請匯出進度。');
</script></body></html>
